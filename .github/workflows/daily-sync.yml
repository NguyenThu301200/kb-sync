name: daily-sync

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kb-sync .

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state
          key: kb-sync-state-${{ github.run_id }}
          restore-keys: kb-sync-state-

      - name: Run sync
        run: |
          mkdir -p state
          docker run --rm \
            -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            -v "$PWD/state:/app/data" \
            kb-sync

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: state/state.json
